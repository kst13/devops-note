# 방식 A: 매니페스트를 한 번 적용한 뒤, 새 버전은 Rancher UI 에서 image 태그만 바꿔 배포한다.
# image 의 레지스트리 주소와 태그는 build.sh 가 push 한 값과 맞춘다.
apiVersion: v1
kind: Namespace
metadata:
  name: webwas
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web-portal
  namespace: webwas
spec:
  replicas: 2
  selector:
    matchLabels:
      app: web-portal
  template:
    metadata:
      labels:
        app: web-portal
    spec:
      containers:
        - name: web-portal
          image: 192.168.64.3:5050/web-portal:1.0.0
          env:
            - name: WAS_HOST
              value: was-order.webwas.svc.cluster.local
          ports:
            - name: http
              containerPort: 80
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
          resources:
            requests:
              cpu: 50m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 64Mi
---
apiVersion: v1
kind: Service
metadata:
  name: web-portal
  namespace: webwas
spec:
  selector:
    app: web-portal
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: was-order
  namespace: webwas
spec:
  replicas: 2
  selector:
    matchLabels:
      app: was-order
  template:
    metadata:
      labels:
        app: was-order
    spec:
      containers:
        - name: was-order
          image: 192.168.64.3:5050/was-order:1.0.0
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: http
            initialDelaySeconds: 10
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            initialDelaySeconds: 30
          resources:
            requests:
              cpu: 100m
              memory: 256Mi        # limits 보다 작게 → Burstable. dev 노드 swap(LimitedSwap) 대상이 된다
            limits:
              cpu: 500m
              memory: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: was-order
  namespace: webwas
spec:
  selector:
    app: was-order
  ports:
    - name: http
      port: 8080
      targetPort: http
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: web-portal
  namespace: webwas
spec:
  ingressClassName: traefik
  rules:
    - host: app.dev.192-168-64-3.sslip.io
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: web-portal
                port:
                  name: http
