apiVersion: apps/v1
kind: Deployment
metadata:
  name: web-portal
  labels:
    {{- include "web-portal.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicas }}
  selector:
    matchLabels:
      app: web-portal
  template:
    metadata:
      labels:
        app: web-portal
    spec:
      containers:
        - name: web-portal
          image: {{ include "web-portal.image" . }}
          env:
            - name: WAS_HOST
              value: "{{ .Values.wasHost | default (printf "was-order.%s.svc.cluster.local" .Release.Namespace) }}"
          ports:
            - name: http
              containerPort: 80
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
