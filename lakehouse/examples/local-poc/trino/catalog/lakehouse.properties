# Trino Catalog "lakehouse" — SQL 에서 lakehouse.<schema>.<table> 로 접근한다.
# 이 파일의 lakehouse 는 Trino Catalog(연결 설정 이름)이고, 아래 iceberg.catalog.type 이 Iceberg Catalog 다.
connector.name=iceberg
iceberg.catalog.type=rest
iceberg.rest-catalog.uri=http://iceberg-rest:8181
iceberg.rest-catalog.warehouse=s3://lakehouse/warehouse

# MinIO 접근 — Trino 네이티브 S3 파일시스템 (공식 문서가 MinIO 호환성 테스트를 명시)
fs.native-s3.enabled=true
s3.endpoint=http://minio:9000
s3.region=us-east-1
s3.path-style-access=true
# 자격증명은 파일에 적지 않고 컨테이너 환경변수에서 읽는다 (Trino secrets: ${ENV:VAR})
s3.aws-access-key=${ENV:LAKEHOUSE_ACCESS_KEY}
s3.aws-secret-key=${ENV:LAKEHOUSE_SECRET_KEY}
