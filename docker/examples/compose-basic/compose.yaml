services:
  web:
    image: nginx:alpine
    ports:
      - "127.0.0.1:8080:80"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/"]
      interval: 10s
      timeout: 3s
      retries: 3

  redis:
    image: redis:8-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "PING"]
      interval: 5s
      timeout: 3s
      retries: 5

  checker:
    image: redis:8-alpine
    depends_on:
      redis:
        condition: service_healthy
    command: ["redis-cli", "-h", "redis", "PING"]

volumes:
  redis-data:
